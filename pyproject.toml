[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-sparse"
version = "0.1.0"
description = "Research fork: extending Laya's encoder models to larger context windows via sparse attention"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20.0",
]

[tool.setuptools]
packages = ["laya"]

[project.urls]
Source = "https://github.com/<your-org>/laya-sparse"
